name: Docs

on:
  push:
    branches: [main]
    paths: ['docs/**', 'example/**', 'src/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Derived from the repo name so the site survives a rename.
      DOCS_BASE: /${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The example resolves expo-splitkit from the repo root, so root deps are needed too.
      - name: Install library dependencies
        run: npm ci --ignore-scripts

      - name: Build web demo
        working-directory: example
        env:
          EXPO_BASE_URL: /${{ github.event.repository.name }}/live
        run: |
          npm ci
          npx expo export --platform web --output-dir ../docs/public/live

      - name: Build docs
        working-directory: docs
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
